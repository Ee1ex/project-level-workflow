<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Project Level Workflow execution map</title>
  <desc id="desc">Four project responsibility levels route through three execution modes into evidence, memory, and a GitHub delivery gate.</desc>
  <rect width="1200" height="420" rx="10" fill="#09111F"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#65E6D1"/>
    </marker>
  </defs>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif">
    <text x="64" y="68" fill="#F6F8FB" font-size="28" font-weight="700">One path. The right amount of process.</text>
    <text x="64" y="102" fill="#9EACBF" font-size="18">Responsibility decides depth; risk decides where the work pauses.</text>

    <g transform="translate(64 162)">
      <rect width="216" height="144" rx="10" fill="#101D30" stroke="#334155" stroke-width="2"/>
      <text x="24" y="34" fill="#65E6D1" font-size="18" font-weight="650" letter-spacing="1">RESPONSIBILITY</text>
      <text x="24" y="70" fill="#F6F8FB" font-size="22" font-weight="650">LEVEL 1–4</text>
      <text x="24" y="102" fill="#9EACBF" font-size="18">Build · Operate</text>
      <text x="24" y="126" fill="#9EACBF" font-size="18">Improve · Orchestrate</text>
      <path d="M224 72 H286" fill="none" stroke="#65E6D1" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(296)">
        <rect width="224" height="144" rx="10" fill="#101D30" stroke="#65E6D1" stroke-width="2"/>
        <text x="24" y="34" fill="#65E6D1" font-size="18" font-weight="650" letter-spacing="1">EXECUTION</text>
        <text x="24" y="70" fill="#F6F8FB" font-size="20" font-weight="650">AUTO</text>
        <text x="24" y="98" fill="#F6F8FB" font-size="20" font-weight="650">CONFIRM</text>
        <text x="24" y="126" fill="#9EACBF" font-size="20" font-weight="650">MANUAL_ONLY</text>
      </g>
      <path d="M528 72 H590" fill="none" stroke="#65E6D1" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(600)">
        <rect width="216" height="144" rx="10" fill="#101D30" stroke="#334155" stroke-width="2"/>
        <text x="24" y="34" fill="#65E6D1" font-size="18" font-weight="650" letter-spacing="1">CONTINUITY</text>
        <text x="24" y="74" fill="#F6F8FB" font-size="22" font-weight="650">Evidence</text>
        <text x="24" y="108" fill="#F6F8FB" font-size="22" font-weight="650">&amp; Memory</text>
      </g>
      <path d="M824 72 H886" fill="none" stroke="#65E6D1" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(896)">
        <rect width="176" height="144" rx="10" fill="#65E6D1"/>
        <text x="24" y="34" fill="#09111F" font-size="18" font-weight="700" letter-spacing="1">DELIVERY</text>
        <text x="24" y="76" fill="#09111F" font-size="22" font-weight="700">GitHub</text>
        <text x="24" y="108" fill="#09111F" font-size="22" font-weight="700">Gate</text>
      </g>
    </g>

    <text x="64" y="364" fill="#9EACBF" font-size="18">Routine progress keeps moving. High-risk and public actions stop for confirmation.</text>
  </g>
</svg>
